<section class="login-shell">
  <div class="login-card">
    <h1>Desk Login</h1>
    
    @if (isLoading()) {
      <p class="helper-text">Loading access details...</p>
    } @else {
      <form [formGroup]="loginForm" (ngSubmit)="submit()" novalidate>
        <label for="userId">User name</label>
        <select id="userId" formControlName="userId" autocomplete="username">
          <option [ngValue]="0">Select user</option>
          @for (user of users(); track user.userId) {
            <option [ngValue]="user.userId">{{ user.name }}</option>
          }
        </select>

        @if (isOtherSelected()) {
          <label for="otherName">Name</label>
          <input id="otherName" type="text" formControlName="otherName" autocomplete="name" placeholder="Enter name" />
        } @else {
          <label for="passcode">Passcode</label>
          <input
            id="passcode"
            type="password"
            formControlName="passcode"
            inputmode="numeric"
            autocomplete="one-time-code"
            placeholder="Enter passcode"
          />
        }

        @if (showValidationError()) {
          <p class="error-text">Select a user and enter a numeric passcode.</p>
        }

        <button type="submit">Login</button>
      </form>
    }

    @if (errorMessage()) {
      <p class="error-text">{{ errorMessage() }}</p>
    }

    <button class="read-only-btn" type="button" (click)="continueReadOnly()">
      Continue in read-only mode
    </button>
  </div>
</section>
