<section class="login-shell">
  <div class="login-card">
    <h1>Desk Login</h1>
    
    @if (isLoading()) {
      <p class="helper-text">Loading access details...</p>
    } @else {
      <form [formGroup]="loginForm" (ngSubmit)="submit()" novalidate>
        <label for="userId">Usercode</label>
        <select id="userId" formControlName="userId">
          <option [ngValue]="0">Select user</option>
          @for (user of users; track user.id) {
            <option [ngValue]="user.id">{{ user.name }}</option>
          }
        </select>

        <label for="passcode">Passcode</label>
        <input
          id="passcode"
          type="password"
          formControlName="passcode"
          autocomplete="one-time-code"
          placeholder="Enter passcode"
        />

        @if (showValidationError()) {
          <p class="error-text">Select a user and enter a six-digit numeric passcode.</p>
        }

        <button type="submit">Login</button>
      </form>
    }

    @if (errorMessage()) {
      <p class="error-text">{{ errorMessage() }}</p>
    }

    <button class="read-only-btn" type="button" (click)="continueReadOnly()">
      Continue in read-only mode
    </button>
  </div>
</section>
